    <style>
        :root {
            --build-red: #C41E3A;
            --build-red-dark: #9A1729;
            --build-red-light: #E63950;
            --charcoal: #1a1a1a;
            --slate: #2d2d2d;
            --stone: #3d3d3d;
            --silver: #6b7280;
            --pearl: #f5f5f5;
            --white: #ffffff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --purple: #8b5cf6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Sans 3', sans-serif;
            background: linear-gradient(135deg, var(--charcoal) 0%, #0d0d0d 100%);
            min-height: 100vh;
            color: var(--pearl);
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            color: var(--build-red);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .login-subtitle {
            color: var(--silver);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        
        .login-card {
            background: var(--slate);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        
        .login-title {
            font-size: 1.5rem;
            color: var(--pearl);
            margin-bottom: 24px;
            text-align: center;
        }
        
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .role-btn {
            padding: 20px 24px;
            background: var(--charcoal);
            border: 2px solid var(--stone);
            border-radius: 12px;
            color: var(--pearl);
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .role-btn:hover {
            border-color: var(--build-red);
            background: rgba(196, 30, 58, 0.1);
        }
        
        .role-btn.admin:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.1);
        }
        
        .role-btn.parent:hover {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .role-btn.coach:hover {
            border-color: var(--info);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .role-icon {
            font-size: 2rem;
        }
        
        .role-info {
            text-align: left;
        }
        
        .role-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .role-description {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.85rem;
            color: var(--silver);
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--build-red) 0%, var(--build-red-dark) 100%);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px rgba(196, 30, 58, 0.3);
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header.admin-header {
            background: linear-gradient(135deg, var(--purple) 0%, #6d28d9 100%);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3);
        }
        
        .header.parent-header {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
        }
        
        .header.coach-header {
            background: linear-gradient(135deg, var(--info) 0%, #1d4ed8 100%);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .header-title {
            font-size: 1.8rem;
            color: white;
            text-transform: uppercase;
        }
        
        .header-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            margin-top: 2px;
        }
        
        .user-badge {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .athlete-badge {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: right;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .athlete-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            color: white;
            font-weight: 600;
        }
        
        .athlete-details {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 12px 24px;
            background: var(--slate);
            border: none;
            border-radius: 10px;
            color: var(--silver);
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .nav-tab:hover {
            background: var(--stone);
            color: var(--pearl);
        }
        
        .nav-tab.active {
            background: var(--build-red);
            color: white;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
        }
        
        .nav-tab.admin-active {
            background: var(--purple);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        
        .nav-tab.parent-active {
            background: var(--success);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        /* Content Panels */
        .content-panel {
            background: var(--slate);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .section-title {
            font-size: 1.4rem;
            color: var(--build-red-light);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--stone);
        }
        
        .section-title.admin-title {
            color: var(--purple);
        }
        
        .section-title.parent-title {
            color: var(--success);
        }
        
        /* Athlete Search */
        .search-container {
            margin-bottom: 24px;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--charcoal);
            border: 2px solid var(--stone);
            border-radius: 10px;
            color: var(--pearl);
            font-size: 1.1rem;
            font-family: 'Source Sans 3', sans-serif;
            transition: border-color 0.2s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--success);
        }
        
        .search-input::placeholder {
            color: var(--silver);
        }
        
        /* Report Card Style */
        .report-card {
            background: var(--charcoal);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--stone);
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--stone);
        }
        
        .report-athlete-info h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            color: var(--pearl);
            margin-bottom: 4px;
        }
        
        .report-athlete-meta {
            color: var(--silver);
            font-size: 0.95rem;
        }
        
        .report-date {
            text-align: right;
            color: var(--silver);
            font-size: 0.9rem;
        }
        
        .report-score-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .report-score-box {
            background: var(--slate);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .report-score-value {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .report-score-label {
            color: var(--silver);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        
        .report-score-category {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .report-score-category.low-risk {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .report-score-category.moderate-risk {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .report-score-category.high-risk {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .report-section {
            margin-bottom: 24px;
        }
        
        .report-section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            color: var(--success);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--stone);
        }
        
        /* Print styles for report */
        @media print {
            body {
                background: white;
                color: black;
            }
            
            .header, .nav-tabs, .logout-btn, .footer {
                display: none;
            }
            
            .content-panel {
                box-shadow: none;
                padding: 0;
            }
            
            .report-card {
                border: 1px solid #ccc;
            }
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: var(--pearl);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--charcoal);
            border: 2px solid var(--stone);
            border-radius: 8px;
            color: var(--pearl);
            font-size: 1rem;
            font-family: 'Source Sans 3', sans-serif;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--build-red);
        }
        
        .form-select {
            cursor: pointer;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: var(--build-red);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--build-red-dark);
        }
        
        .btn-primary.admin-btn {
            background: var(--purple);
        }
        
        .btn-primary.admin-btn:hover {
            background: #6d28d9;
        }
        
        .btn-secondary {
            background: var(--stone);
            color: var(--pearl);
        }
        
        .btn-secondary:hover {
            background: var(--silver);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        
        /* Team/Position Cards */
        .team-card {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--stone);
        }
        
        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .team-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            color: var(--pearl);
        }
        
        .team-sport {
            color: var(--silver);
            font-size: 0.9rem;
        }
        
        .position-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .position-tag {
            background: var(--stone);
            color: var(--pearl);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .position-tag .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }
        
        .add-position-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .add-position-form input {
            flex: 1;
            padding: 8px 12px;
            background: var(--slate);
            border: 1px solid var(--stone);
            border-radius: 6px;
            color: var(--pearl);
            font-size: 0.9rem;
        }
        
        /* Athlete List */
        .athlete-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        
        .athlete-card {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 16px;
            border: 2px solid var(--stone);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .athlete-card:hover {
            border-color: var(--build-red);
        }
        
        .athlete-card.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .athlete-card-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: var(--pearl);
            margin-bottom: 4px;
        }
        
        .athlete-card-info {
            color: var(--silver);
            font-size: 0.85rem;
        }
        
        .athlete-card-team {
            color: var(--build-red-light);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        .athlete-card-score {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--stone);
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        
        .score-left, .score-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .score-value {
            font-weight: 600;
        }
        
        .score-value.high-risk { color: var(--danger); }
        .score-value.moderate-risk { color: var(--warning); }
        .score-value.low-risk { color: var(--success); }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--silver);
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            color: var(--pearl);
            margin-bottom: 8px;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal {
            background: var(--slate);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: var(--pearl);
            margin-bottom: 24px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        
        /* Test Cards */
        .test-card {
            background: var(--charcoal);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid var(--stone);
            transition: all 0.3s ease;
        }
        
        .test-card:hover {
            border-color: var(--build-red);
        }
        
        .test-header {
            padding: 14px 18px;
            background: linear-gradient(90deg, var(--stone) 0%, var(--slate) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .test-header:hover {
            background: linear-gradient(90deg, var(--build-red-dark) 0%, var(--stone) 100%);
        }
        
        .test-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: white;
        }
        
        .test-score-badge {
            background: var(--build-red);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .test-content {
            padding: 18px;
            display: none;
        }
        
        .test-content.expanded {
            display: block;
        }
        
        /* Domain Scoring Grid */
        .domain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }
        
        .domain-card {
            background: var(--slate);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid var(--stone);
        }
        
        .domain-name {
            font-size: 0.8rem;
            color: var(--silver);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .score-buttons {
            display: flex;
            gap: 5px;
        }
        
        .score-btn {
            flex: 1;
            padding: 8px 6px;
            border: 2px solid var(--stone);
            background: transparent;
            color: var(--silver);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        
        .score-btn:hover {
            border-color: var(--build-red);
            color: var(--pearl);
        }
        
        .score-btn.selected-0 {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        
        .score-btn.selected-1 {
            background: var(--warning);
            border-color: var(--warning);
            color: var(--charcoal);
        }
        
        .score-btn.selected-2 {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }
        
        .score-btn.selected-na {
            background: var(--silver);
            border-color: var(--silver);
            color: white;
        }
        
        /* Image Upload Section */
        .image-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--stone);
        }
        
        .image-section-title {
            font-size: 0.9rem;
            color: var(--pearl);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        
        .image-upload-box {
            aspect-ratio: 4/3;
            background: var(--charcoal);
            border: 2px dashed var(--stone);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .image-upload-box:hover {
            border-color: var(--build-red);
            background: rgba(196, 30, 58, 0.1);
        }
        
        .image-upload-box.has-image {
            border-style: solid;
            border-color: var(--success);
        }
        
        .image-upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .upload-icon {
            font-size: 1.8rem;
            color: var(--silver);
            margin-bottom: 6px;
        }
        
        .upload-label {
            font-size: 0.7rem;
            color: var(--silver);
            text-align: center;
            padding: 0 6px;
        }
        
        .image-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .image-upload-box:hover .image-delete-btn {
            display: flex;
        }
        
        /* Results Panel */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        
        .result-card {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--stone);
        }
        
        .result-title {
            font-size: 0.9rem;
            color: var(--silver);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .result-score {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            color: var(--pearl);
        }
        
        .result-label {
            font-size: 0.85rem;
            color: var(--silver);
        }
        
        .progress-bar {
            height: 8px;
            background: var(--stone);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .progress-low { background: var(--danger); }
        .progress-moderate { background: var(--warning); }
        .progress-good { background: var(--success); }
        
        /* Risk Cards */
        .risk-card {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
            border-left: 4px solid;
        }
        
        .risk-high { border-color: var(--danger); }
        .risk-moderate { border-color: var(--warning); }
        .risk-low { border-color: var(--success); }
        
        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .risk-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: var(--pearl);
        }
        
        .risk-percentage {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }
        
        .risk-percentage.high { color: var(--danger); }
        .risk-percentage.moderate { color: var(--warning); }
        .risk-percentage.low { color: var(--success); }
        
        .risk-factors {
            color: var(--silver);
            font-size: 0.85rem;
        }
        
        /* Exercise Cards */
        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }
        
        .exercise-card {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--stone);
            transition: all 0.3s ease;
        }
        
        .exercise-card:hover {
            border-color: var(--build-red);
        }
        
        .exercise-card.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .exercise-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .exercise-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--success);
            cursor: pointer;
            margin-top: 2px;
        }
        
        .exercise-name {
            font-weight: 600;
            color: var(--pearl);
            font-size: 0.95rem;
        }
        
        .exercise-details {
            margin-left: 32px;
            margin-top: 6px;
        }
        
        .exercise-prescription {
            color: var(--build-red-light);
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .exercise-rationale {
            color: var(--silver);
            font-size: 0.8rem;
            margin-top: 4px;
            font-style: italic;
        }
        
        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: var(--charcoal);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            border: 1px solid var(--stone);
        }
        
        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
        }
        
        .stat-value.low-risk { color: var(--success); }
        .stat-value.moderate-risk { color: var(--warning); }
        .stat-value.high-risk { color: var(--danger); }
        
        .stat-label {
            color: var(--silver);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        /* Asymmetry Alert */
        .asymmetry-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }
        
        .asymmetry-alert-title {
            color: var(--danger);
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .asymmetry-alert-text {
            color: var(--pearl);
            font-size: 0.85rem;
        }
        
        /* Leg Toggle */
        .leg-toggle {
            display: flex;
            background: var(--charcoal);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 16px;
        }
        
        .leg-btn {
            flex: 1;
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--silver);
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        
        .leg-btn.active {
            background: var(--build-red);
            color: white;
        }
        
        /* Domain category styling */
        .domain-category {
            margin-bottom: 20px;
        }
        
        .category-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--build-red-light);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--stone);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--silver);
            font-size: 0.8rem;
        }
        
        .footer a {
            color: var(--build-red-light);
            text-decoration: none;
        }
        
        /* Hidden file input */
        .hidden-input {
            display: none;
        }
        
        /* Info text */
        .info-text {
            color: var(--silver);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        
        /* No athlete selected message */
        .no-athlete-message {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--info);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .no-athlete-message h3 {
            color: var(--info);
            margin-bottom: 8px;
        }
        
        .no-athlete-message p {
            color: var(--pearl);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .header-left {
                flex-direction: column;
            }
            
            .athlete-badge {
                text-align: center;
            }
            
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .nav-tab {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        /* ============== BAR CHART STYLES ============== */
        .bar-chart-container {
            margin: 20px 0;
        }
        
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .bar-label {
            width: 140px;
            font-size: 0.85rem;
            color: var(--silver);
            text-align: right;
            flex-shrink: 0;
        }
        
        .bar-track {
            flex: 1;
            height: 24px;
            background: var(--stone);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }
        
        .bar-fill.good { background: linear-gradient(90deg, #059669, #10b981); }
        .bar-fill.moderate { background: linear-gradient(90deg, #d97706, #f59e0b); }
        .bar-fill.poor { background: linear-gradient(90deg, #dc2626, #ef4444); }
        
        .bar-value {
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .bar-score {
            width: 50px;
            text-align: left;
            font-weight: 600;
            color: var(--pearl);
            font-size: 0.9rem;
        }
        
        /* ============== LOGO UPLOAD STYLES ============== */
        .logo-upload-section {
            background: var(--charcoal);
            border: 2px dashed var(--stone);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .logo-upload-section:hover {
            border-color: var(--build-red);
            background: rgba(196, 30, 58, 0.1);
        }
        
        .logo-upload-section.has-logo {
            border-style: solid;
            border-color: var(--success);
        }
        
        .logo-preview {
            max-height: 80px;
            max-width: 200px;
            object-fit: contain;
        }
        
        .logo-placeholder {
            color: var(--silver);
            font-size: 0.9rem;
        }
        
        /* ============== QR CODE STYLES ============== */
        .qr-code-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: white;
            border-radius: 8px;
        }
        
        .qr-code-label {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
        }
        
        /* ============== PRINT BUTTON GROUP ============== */
        .print-button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .print-btn-dropdown {
            position: relative;
        }
        
        .print-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--slate);
            border: 1px solid var(--stone);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
        }
        
        .print-dropdown-menu.show {
            display: block;
        }
        
        .print-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: var(--pearl);
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
        }
        
        .print-dropdown-item:hover {
            background: var(--stone);
        }
        
        .print-dropdown-item .icon {
            font-size: 1.1rem;
        }
        
        /* ============== INDIVIDUAL REPORT PAGE STYLES ============== */
        .athlete-report-page {
            page-break-after: always;
            padding: 20px;
        }
        
        .athlete-report-page:last-child {
            page-break-after: auto;
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px solid var(--build-red);
        }
        
        .report-logo {
            max-height: 60px;
            max-width: 150px;
        }
        
        .report-title-section {
            text-align: center;
            flex: 1;
        }
        
        .report-qr {
            text-align: right;
        }
        
        /* ============== PRINT STYLES ============== */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;

                        return { ...athlete, accessCode: newCode };

            };

                    if (selectedAthleteId === athleteId) {

            // ============== SCORE CALCULATIONS ==============
            
            const calculateLegTotal = (scores, leg) => {
                let total = 0;
                let maxPossible = 0;
                
                Object.keys(scores).forEach(testId => {
                    const testScores = scores[testId];
                    
                    if (testId === 'dropJump') {
                        Object.values(testScores.bilateral || {}).forEach(score => {
                            if (typeof score === 'number') {
                                total += score;
                                maxPossible += 2;
                            }
                        });
                        Object.values(testScores[leg] || {}).forEach(score => {
                            if (typeof score === 'number') {
                                total += score;
                                maxPossible += 2;
                            }
                        });
                    } else {
                        Object.values(testScores[leg] || {}).forEach(score => {
                            if (typeof score === 'number') {
                                total += score;
                                maxPossible += 2;
                            }
                        });
                    }
                });
                
                return { total, maxPossible, percentage: maxPossible > 0 ? Math.round((total / maxPossible) * 100) : 0 };
            };
            
            const calculateDomainAverages = (scores) => {
                const averages = { left: {}, right: {} };
                
                DOMAINS.forEach(domain => {
                    ['left', 'right'].forEach(leg => {
                        let total = 0;
                        let count = 0;
                        
                        domain.tests.forEach(testId => {
                            let score;
                            
                            if (testId === 'dropJump') {
                                if (scores[testId]?.bilateral?.[domain.id] !== undefined && 
                                    scores[testId]?.bilateral?.[domain.id] !== 'N/A' &&
                                    scores[testId]?.bilateral?.[domain.id] !== null) {
                                    score = scores[testId].bilateral[domain.id];
                                } else if (scores[testId]?.[leg]?.[domain.id] !== undefined &&
                                           scores[testId]?.[leg]?.[domain.id] !== 'N/A' &&
                                           scores[testId]?.[leg]?.[domain.id] !== null) {
                                    score = scores[testId][leg][domain.id];
                                }
                            } else {
                                score = scores[testId]?.[leg]?.[domain.id];
                            }
                            
                            if (score !== undefined && score !== 'N/A' && score !== null && typeof score === 'number') {
                                total += score;
                                count++;
                            }
                        });
                        
                        averages[leg][domain.id] = count > 0 ? (total / count).toFixed(1) : 'N/A';
                    });
                });
                
                return averages;

                const domainAverages = calculateDomainAverages(scores);
                let weightedSum = 0;

                    const leftAvg = parseFloat(domainAverages.left[domainId]) || 0;

                    const avg = (leftAvg + rightAvg) / 2;
                    
                    const riskContribution = (2 - avg) / 2;
                    weightedSum += riskContribution * weight;
                    totalWeight += weight;

        // ============== SCORES PANEL COMPONENT ==============
        
        function ScoresPanel({ athlete, expandedTests, setExpandedTests, onUpdateScores, onUpdateImages }) {
            
            const toggleTest = (testId) => {
                setExpandedTests(prev => ({
                    ...prev,
                    [testId]: !prev[testId]
                }));
            };
            
            const updateScore = (testId, leg, domain, value) => {
                const newScores = JSON.parse(JSON.stringify(athlete.scores));
                if (!newScores[testId]) newScores[testId] = {};
                if (!newScores[testId][leg]) newScores[testId][leg] = {};
                newScores[testId][leg][domain] = value;
                onUpdateScores(newScores);
            };
            
            const handleImageUpload = (testId, leg, view, file) => {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const newImages = { ...athlete.images, [`${testId}_${leg}_${view}`]: e.target.result };
                        onUpdateImages(newImages);
                    };
                    reader.readAsDataURL(file);
                }
            };
            
            const deleteImage = (key) => {
                const newImages = { ...athlete.images };
                delete newImages[key];
                onUpdateImages(newImages);
            };
            
            return (
                <>
                    <h2 className="section-title">Movement Test Scoring - {athlete.name}</h2>
                    <p className="info-text">
                        Click each test to expand. Score domains 0-2 for each leg. Upload test images for documentation.
                    </p>
                    
                    {TESTS.map(test => (
                        <div key={test.id} className="test-card">
                            <div className="test-header" onClick={() => toggleTest(test.id)}>
                                <span className="test-name">{test.name}</span>
                                <span className="test-score-badge">
                                    {expandedTests[test.id] ? 'â–¼' : 'â–¶'}
                                </span>
                            </div>
                            
                            <div className={`test-content ${expandedTests[test.id] ? 'expanded' : ''}`}>
                                {test.bilateral ? (
                                    <>
                                        {/* Left Leg */}
                                        <div style={{ marginBottom: '20px' }}>
                                            <h4 style={{ color: 'var(--build-red-light)', marginBottom: '10px', fontFamily: 'Oswald' }}>
                                                LEFT LEG
                                            </h4>
                                            <div className="domain-grid">
                                                {DOMAINS.filter(d => d.tests.includes(test.id)).map(domain => (
                                                    <div key={domain.id} className="domain-card">
                                                        <div className="domain-name">{domain.name}</div>
                                                        <div className="score-buttons">
                                                            {[0, 1, 2, 'N/A'].map(score => (
                                                                <button
                                                                    key={score}
                                                                    className={`score-btn ${athlete.scores[test.id]?.left?.[domain.id] === score ? 
                                                                        (score === 'N/A' ? 'selected-na' : `selected-${score}`) : ''}`}
                                                                    onClick={() => updateScore(test.id, 'left', domain.id, score)}
                                                                >
                                                                    {score}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        {/* Right Leg */}
                                        <div>
                                            <h4 style={{ color: 'var(--build-red-light)', marginBottom: '10px', fontFamily: 'Oswald' }}>
                                                RIGHT LEG
                                            </h4>
                                            <div className="domain-grid">
                                                {DOMAINS.filter(d => d.tests.includes(test.id)).map(domain => (

        // ============== RISKS PANEL COMPONENT ==============
        
        function RisksPanel({ athlete, calculateInjuryRisk, getRiskLevel }) {
            return (

                    <p className="info-text">
                        Risk percentages are calculated based on weighted domain scores. Higher percentages indicate greater injury risk.
                    </p>
                    
                    {INJURY_RISKS.map(injury => {
                        const riskPercentage = calculateInjuryRisk(athlete.scores, injury);
                        const riskLevel = getRiskLevel(riskPercentage);
                        
                        return (

                                    <span className="risk-name">{injury.name}</span>

                let totalLeft = 0, totalRight = 0, countLeft = 0, countRight = 0;
                const domainTotals = { left: {}, right: {} };
                
                selected.forEach(athlete => {
                    const leftScore = calculateLegTotal(athlete.scores, 'left');
                    const rightScore = calculateLegTotal(athlete.scores, 'right');
                    
                    if (leftScore.maxPossible > 0) {
                        totalLeft += leftScore.percentage;
                        countLeft++;
                    }
                    if (rightScore.maxPossible > 0) {
                        totalRight += rightScore.percentage;
                        countRight++;
                    }
                    
                    // Aggregate domain averages
                    const domainAvgs = calculateDomainAverages(athlete.scores);
                    ['left', 'right'].forEach(leg => {
                        Object.entries(domainAvgs[leg]).forEach(([domain, avg]) => {
                            if (avg !== 'N/A' && !isNaN(parseFloat(avg))) {
                                if (!domainTotals[leg][domain]) {
                                    domainTotals[leg][domain] = { total: 0, count: 0 };
                                }
                                domainTotals[leg][domain].total += parseFloat(avg);
                                domainTotals[leg][domain].count++;
                            }
                        });
                    });

                // Calculate domain averages
                const domainAverages = { left: {}, right: {} };
                ['left', 'right'].forEach(leg => {
                    Object.entries(domainTotals[leg]).forEach(([domain, data]) => {
                        domainAverages[leg][domain] = data.count > 0 
                            ? (data.total / data.count).toFixed(1) 
                            : 'N/A';

                });

                    athleteCount: selected.length,
                    avgLeftPercentage: countLeft > 0 ? Math.round(totalLeft / countLeft) : 0,
                    avgRightPercentage: countRight > 0 ? Math.round(totalRight / countRight) : 0,

                                                                        className={`progress-fill ${percentage >= 80 ? 'progress-good' : percentage >= 60 ? 'progress-moderate' : 'progress-low'}`}
                                                                        style={{ width: `${percentage}%` }}
                                                                    />
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </>
                                        );
                                    })()}
                                </>
                            ) : (
                                <>
                                    <h2 className="section-title" style={{ color: 'var(--info)' }}>
                                        {selectedPosition !== 'all' ? `${selectedPosition}s` : 'Selected Athletes'} - Aggregate Report
                                    </h2>
                                    
                                    <div style={{ 
                                        background: 'rgba(59, 130, 246, 0.1)', 
                                        border: '1px solid var(--info)',
                                        borderRadius: '10px',
                                        padding: '16px',
                                        marginBottom: '24px'
                                    }}>
                                        <div style={{ fontSize: '0.9rem', color: 'var(--info)' }}>
                                            <strong>{aggregateStats.athleteCount} athletes selected</strong>
                                            {selectedPosition !== 'all' && ` • Position: ${selectedPosition}`}
                                            {selectedTeamId !== 'all' && ` • Team: ${selectedTeam?.name}`}
                                        </div>
                                    </div>
                                    
                                    {/* Aggregate Stats */}
                                    <div className="stats-row">
                                        <div className="stat-box">
                                            <div className={`stat-value ${getCategoryFromPercentage(aggregateStats.avgLeftPercentage).class}`}>
                                                {aggregateStats.avgLeftPercentage}%
                                            </div>
                                            <div className="stat-label">Avg Left Leg</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className={`stat-value ${getCategoryFromPercentage(aggregateStats.avgRightPercentage).class}`}>
                                                {aggregateStats.avgRightPercentage}%
                                            </div>
                                            <div className="stat-label">Avg Right Leg</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className={`stat-value ${getCategoryFromPercentage(Math.round((aggregateStats.avgLeftPercentage + aggregateStats.avgRightPercentage) / 2)).class}`}>
                                                {Math.round((aggregateStats.avgLeftPercentage + aggregateStats.avgRightPercentage) / 2)}%
                                            </div>
                                            <div className="stat-label">Overall Average</div>
                                        </div>
                                    </div>
                                    
                                    {/* Domain Averages */}
                                    <h3 style={{ color: 'var(--pearl)', marginTop: '24px', marginBottom: '16px', fontFamily: 'Oswald' }}>
                                        Domain Averages (Group)
                                    </h3>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' }}>
                                        {DOMAINS.map(domain => {
                                            const leftAvg = parseFloat(aggregateStats.domainAverages.left[domain.id]) || 0;
                                            const rightAvg = parseFloat(aggregateStats.domainAverages.right[domain.id]) || 0;
                                            const avg = (leftAvg + rightAvg) / 2;
                                            const percentage = (avg / 2) * 100;
                                            
                                            return (
                                                <div key={domain.id} style={{
                                                    background: 'var(--charcoal)',
                                                    padding: '12px',
                                                    borderRadius: '8px',
                                                    border: '1px solid var(--stone)'
                                                }}>
                                                    <div style={{ fontSize: '0.85rem', color: 'var(--silver)', marginBottom: '6px' }}>
                                                        {domain.name}
                                                    </div>
                                                    <div style={{ fontFamily: 'Oswald', fontSize: '1.3rem', color: 'var(--pearl)' }}>
                                                        {avg.toFixed(1)} / 2.0
                                                    </div>
                                                    <div className="progress-bar" style={{ marginTop: '6px' }}>
                                                        <div 
                                                            className={`progress-fill ${percentage >= 80 ? 'progress-good' : percentage >= 60 ? 'progress-moderate' : 'progress-low'}`}
                                                            style={{ width: `${percentage}%` }}
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    
                                    {/* Comparison Table */}
                                    <h3 style={{ color: 'var(--pearl)', marginTop: '24px', marginBottom: '16px', fontFamily: 'Oswald' }}>
                                        Individual Comparison
                                    </h3>
                                    <div style={{ overflowX: 'auto' }}>
                                        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.85rem' }}>
                                            <thead>
                                                <tr style={{ background: 'var(--charcoal)' }}>
                                                    <th style={{ padding: '10px', textAlign: 'left', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Athlete</th>
                                                    <th style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Position</th>
                                                    <th style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Left</th>
                                                    <th style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Right</th>
                                                    <th style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Avg</th>
                                                    <th style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)', borderBottom: '2px solid var(--stone)' }}>Risk</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {selectedAthletes.map(athlete => {
                                                    const leftTotal = calculateLegTotal(athlete.scores, 'left');
                                                    const rightTotal = calculateLegTotal(athlete.scores, 'right');
                                                    const avgPercentage = Math.round((leftTotal.percentage + rightTotal.percentage) / 2);
                                                    const category = getCategoryFromPercentage(avgPercentage);
                                                    
                                                    return (
                                                        <tr key={athlete.id} style={{ borderBottom: '1px solid var(--stone)' }}>
                                                            <td style={{ padding: '10px', color: 'var(--pearl)' }}>
                                                                <strong>{athlete.name}</strong>
                                                            </td>
                                                            <td style={{ padding: '10px', textAlign: 'center', color: 'var(--silver)' }}>
                                                                {athlete.position}
                                                            </td>
                                                            <td style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)' }}>
                                                                {leftTotal.percentage}%
                                                            </td>
                                                            <td style={{ padding: '10px', textAlign: 'center', color: 'var(--pearl)' }}>
                                                                {rightTotal.percentage}%
                                                            </td>
                                                            <td style={{ 
                                                                padding: '10px', 
                                                                textAlign: 'center', 
                                                                fontWeight: '600',
                                                                color: category.class === 'high-risk' ? 'var(--danger)' : 
                                                                       category.class === 'moderate-risk' ? 'var(--warning)' : 'var(--success)'
                                                            }}>
                                                                {avgPercentage}%
                                                            </td>
                                                            <td style={{ padding: '10px', textAlign: 'center' }}>
                                                                <span style={{
                                                                    padding: '4px 8px',
                                                                    borderRadius: '4px',
                                                                    fontSize: '0.75rem',
                                                                    fontWeight: '600',
                                                                    background: category.class === 'high-risk' ? 'rgba(239, 68, 68, 0.2)' : 
                                                                               category.class === 'moderate-risk' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(16, 185, 129, 0.2)',
                                                                    color: category.class === 'high-risk' ? 'var(--danger)' : 
                                                                           category.class === 'moderate-risk' ? 'var(--warning)' : 'var(--success)'
                                                                }}>
                                                                    {category.label}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                    </>
                    )}
                    
                    {/* Print Footer (only visible when printing) */}
                    <div className="print-only" style={{ display: 'none', marginTop: '30px', paddingTop: '20px', borderTop: '2px solid #C41E3A' }}>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontSize: '12pt', fontWeight: 'bold', color: '#C41E3A', marginBottom: '5px' }}>
                                BUILD Sports Performance Lab & Physical Therapy
                            </p>
                            <p style={{ fontSize: '10pt', color: '#666' }}>
                                720-710-8136 | info@buildyou.co | buildyou.co
                            </p>
                            <p style={{ fontSize: '9pt', color: '#999', marginTop: '10px' }}>
                                Assessment based on research by Christopher M. Powers, PhD, PT, FACSM, FAPTA - USC Biomechanics Laboratory
                            </p>
                        </div>
                    </div>
                    
                    <div className="footer">
                        <p>Based on research by Christopher M. Powers, PhD, PT, FACSM, FAPTA</p>
                        <p>© 2024 BUILD Sports Performance Lab & Physical Therapy</p>
                    </div>
                </div>
            );
        }
        
        // ============== TRAINING PANEL COMPONENT ==============
        
        function TrainingPanel({ athlete, onUpdateExercises }) {
            const toggleExercise = (domain, index) => {
                const key = `${domain}_${index}`;
                const newExercises = { 
                    ...athlete.selectedExercises, 
                    [key]: !athlete.selectedExercises[key] 
                };
                onUpdateExercises(newExercises);
            };
            
            return (
                <>
                    <h2 className="section-title">Training Plan - {athlete.name}</h2>
                    <p className="info-text">
                        Select exercises to include in the training program. Exercises are organized by movement domain.
                    </p>
                    
                    {DOMAINS.map(domain => (
                        <div key={domain.id} className="domain-category">
                            <h3 className="category-title">{domain.name}</h3>
                            <div className="exercise-grid">
                                {EXERCISES[domain.id]?.map((exercise, index) => {
                                    const key = `${domain.id}_${index}`;
                                    const isSelected = athlete.selectedExercises[key];
                                    
                                    return (
                                        <div 
                                            key={key} 
                                            className={`exercise-card ${isSelected ? 'selected' : ''}`}
                                            onClick={() => toggleExercise(domain.id, index)}
                                        >
                                            <div className="exercise-header">
                                                <input 
                                                    type="checkbox" 
                                                    className="exercise-checkbox"
                                                    checked={isSelected || false}
                                                    onChange={() => {}}
                                                />
                                                <span className="exercise-name">{exercise.name}</span>
                                            </div>
                                            <div className="exercise-details">
                                                <div className="exercise-prescription">{exercise.prescription}</div>
                                                <div className="exercise-rationale">Why it helps: {exercise.rationale}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                    
                    {/* Selected Exercises Summary */}
                    <div style={{ 
                        marginTop: '24px', 
                        padding: '18px', 
                        background: 'var(--charcoal)', 
                        borderRadius: '12px',
                        border: '1px solid var(--stone)'
                    }}>
                        <h3 style={{ color: 'var(--build-red-light)', marginBottom: '10px', fontFamily: 'Oswald' }}>
                            Selected Exercises ({Object.values(athlete.selectedExercises).filter(Boolean).length})
                        </h3>
                        {Object.values(athlete.selectedExercises).filter(Boolean).length === 0 ? (
                            <p style={{ color: 'var(--silver)' }}>Click exercises above to add them to the training plan.</p>
                        ) : (
                            <ul style={{ color: 'var(--pearl)', paddingLeft: '18px', fontSize: '0.9rem' }}>
                                {Object.entries(athlete.selectedExercises).filter(([_, v]) => v).map(([key]) => {
                                    const [domainId, indexStr] = key.split('_');
                                    const index = parseInt(indexStr);
                                    const exercise = EXERCISES[domainId]?.[index];
                                    if (!exercise) return null;
                                    
                                    return (
                                        <li key={key} style={{ marginBottom: '6px' }}>
                                            <strong>{exercise.name}</strong> â€” {exercise.prescription}
                                        </li>
                                    );
                                })}
                            </ul>
                        )}
                    </div>
                </>
            );
        }
        
        // Render the app
        ReactDOM.createRoot(document.getElementById('root')).render(<MPAApp />);
    </script>
</body>
</html>
