<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPA Interactive Tool | Build Sports Performance Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const MPAInteractiveTool = () => {
      const [activeTab, setActiveTab] = useState('scores');
      const [whatIfMode, setWhatIfMode] = useState(false);
      const [expandedTests, setExpandedTests] = useState({ stepDown: true });
      const [expandedDomains, setExpandedDomains] = useState({});
      const [selectedExercises, setSelectedExercises] = useState([]);
      
      const athleteInfo = { name: 'Judah S.', age: '16', sport: 'Soccer', date: '2024-11-17' };

      const tests = [
        { id: 'stepDown', name: 'Step Down', maxPerLeg: 8, description: 'Single-leg stability on 8" step' },
        { id: 'dropJump', name: 'Drop Jump', maxPerLeg: 6, description: 'Bilateral landing from 18" box' },
        { id: 'deceleration', name: 'Deceleration', maxPerLeg: 10, description: 'Single-leg stopping from sprint' },
        { id: 'sideCut', name: 'Side-Step Cut', maxPerLeg: 10, description: '90° change of direction' }
      ];

      const domains = [
        { id: 'hipStability', name: 'Hip Stability' },
        { id: 'pelvisStability', name: 'Pelvis Stability' },
        { id: 'trunkStability', name: 'Trunk Stability' },
        { id: 'shockAbsorption', name: 'Shock Absorption' },
        { id: 'hipStrategy', name: 'Hip Strategy' }
      ];

      const domainApplicability = {
        stepDown: { hipStability: true, pelvisStability: true, trunkStability: true, shockAbsorption: false, hipStrategy: true },
        dropJump: { hipStability: true, pelvisStability: false, trunkStability: false, shockAbsorption: true, hipStrategy: true },
        deceleration: { hipStability: true, pelvisStability: true, trunkStability: true, shockAbsorption: true, hipStrategy: true },
        sideCut: { hipStability: true, pelvisStability: true, trunkStability: true, shockAbsorption: true, hipStrategy: true }
      };

      const [scores, setScores] = useState({
        stepDown: {
          L: { hipStability: 1, pelvisStability: 2, trunkStability: 0, hipStrategy: 1 },
          R: { hipStability: 2, pelvisStability: 2, trunkStability: 2, hipStrategy: 1 }
        },
        dropJump: {
          L: { hipStability: 2, shockAbsorption: 2, hipStrategy: 1 },
          R: { hipStability: 2, shockAbsorption: 2, hipStrategy: 1 }
        },
        deceleration: {
          L: { hipStability: 1, pelvisStability: 1, trunkStability: 2, shockAbsorption: 0, hipStrategy: 0 },
          R: { hipStability: 1, pelvisStability: 2, trunkStability: 1, shockAbsorption: 1, hipStrategy: 1 }
        },
        sideCut: {
          L: { hipStability: 1, pelvisStability: 1, trunkStability: 1, shockAbsorption: 0, hipStrategy: 0 },
          R: { hipStability: 1, pelvisStability: 2, trunkStability: 1, shockAbsorption: 1, hipStrategy: 0 }
        }
      });

      const [whatIfScores, setWhatIfScores] = useState(JSON.parse(JSON.stringify(scores)));
      const activeScores = whatIfMode ? whatIfScores : scores;

      const updateScore = (testId, side, domainId, value) => {
        const setter = whatIfMode ? setWhatIfScores : setScores;
        setter(prev => ({
          ...prev,
          [testId]: { ...prev[testId], [side]: { ...prev[testId][side], [domainId]: parseInt(value) } }
        }));
      };

      const calculateTestTotal = (testId, side) => Object.values(activeScores[testId][side]).reduce((sum, val) => sum + (val || 0), 0);
      const calculateLegTotal = (side) => tests.reduce((sum, test) => sum + calculateTestTotal(test.id, side), 0);

      const calculateDomainAverage = (domainId) => {
        let total = 0, count = 0;
        ['L', 'R'].forEach(side => {
          tests.forEach(test => {
            if (domainApplicability[test.id][domainId]) {
              const score = activeScores[test.id][side]?.[domainId];
              if (score !== undefined) { total += score; count++; }
            }
          });
        });
        return count > 0 ? total / count : 0;
      };

      const getRiskCategory = (score, maxScore = 34) => {
        const pct = (score / maxScore) * 100;
        if (pct >= 80) return { label: 'Low Risk', color: 'bg-green-500', bgLight: 'bg-green-50', border: 'border-green-500' };
        if (pct >= 60) return { label: 'Moderate Risk', color: 'bg-yellow-500', bgLight: 'bg-yellow-50', border: 'border-yellow-500' };
        return { label: 'High Risk', color: 'bg-red-500', bgLight: 'bg-red-50', border: 'border-red-500' };
      };

      const getDomainInterp = (avg) => {
        if (avg >= 1.6) return { label: 'Strong', color: 'text-green-600', bg: 'bg-green-100' };
        if (avg >= 0.8) return { label: 'Developing', color: 'text-yellow-600', bg: 'bg-yellow-100' };
        return { label: 'Needs Improvement', color: 'text-red-600', bg: 'bg-red-100' };
      };

      const getScoreColor = (score) => {
        if (score === 2) return 'bg-green-100 text-green-800';
        if (score === 1) return 'bg-yellow-100 text-yellow-800';
        return 'bg-red-100 text-red-800';
      };

      const injuryRisks = useMemo(() => {
        const avgs = {};
        domains.forEach(d => { avgs[d.id] = calculateDomainAverage(d.id); });
        
        const calcRisk = (weights) => {
          let sum = 0, total = 0;
          Object.entries(weights).forEach(([d, w]) => {
            sum += ((2 - avgs[d]) / 2) * w;
            total += w;
          });
          return Math.round((sum / total) * 100);
        };

        return [
          { name: 'ACL Injury', risk: calcRisk({ hipStability: 35, shockAbsorption: 35, hipStrategy: 30 }), icon: '🦵' },
          { name: 'Patellofemoral Pain', risk: calcRisk({ hipStrategy: 40, hipStability: 35, shockAbsorption: 25 }), icon: '🏃' },
          { name: 'Hip/Groin Strain', risk: calcRisk({ pelvisStability: 40, hipStability: 30, hipStrategy: 30 }), icon: '🦴' },
          { name: 'Lower Back Pain', risk: calcRisk({ trunkStability: 55, pelvisStability: 45 }), icon: '🔙' },
          { name: 'Ankle Sprain', risk: calcRisk({ hipStability: 50, shockAbsorption: 50 }), icon: '🦶' }
        ];
      }, [activeScores]);

      const exerciseLibrary = {
        hipStability: [
          { name: 'Clamshells with Band', sets: '3×15', why: 'Activates gluteus medius for femoral control' },
          { name: 'Side-Lying Hip Abduction', sets: '3×12', why: 'Strengthens hip abductors' },
          { name: 'Single-Leg Balance', sets: '3×30s', why: 'Challenges hip stability' }
        ],
        pelvisStability: [
          { name: 'Single-Leg RDL', sets: '3×10', why: 'Challenges pelvic control' },
          { name: 'Lateral Band Walks', sets: '3×15', why: 'Maintains level pelvis' }
        ],
        trunkStability: [
          { name: 'Pallof Press', sets: '3×12', why: 'Anti-rotation core training' },
          { name: 'Side Plank', sets: '3×30s', why: 'Lateral trunk stability' }
        ],
        shockAbsorption: [
          { name: 'Box Drop Landings', sets: '3×5', why: 'Teaches soft landing' },
          { name: 'Squat to Box', sets: '3×10', why: 'Hip flexion depth' }
        ],
        hipStrategy: [
          { name: 'Glute Bridge Hold', sets: '3×15', why: 'Activates gluteus maximus' },
          { name: 'Romanian Deadlift', sets: '3×10', why: 'Hip hinge pattern' },
          { name: 'Monster Walks', sets: '3×15', why: 'Hip-dominant movement' }
        ]
      };

      const toggleTest = (id) => setExpandedTests(p => ({ ...p, [id]: !p[id] }));
      const toggleDomain = (id) => setExpandedDomains(p => ({ ...p, [id]: !p[id] }));
      const toggleExercise = (ex) => {
        setSelectedExercises(p => p.find(e => e.name === ex.name) ? p.filter(e => e.name !== ex.name) : [...p, ex]);
      };

      const leftTotal = calculateLegTotal('L');
      const rightTotal = calculateLegTotal('R');
      const leftRisk = getRiskCategory(leftTotal);
      const rightRisk = getRiskCategory(rightTotal);
      const asymmetry = Math.round(Math.abs(leftTotal - rightTotal) / Math.max(leftTotal, rightTotal) * 100);

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-gradient-to-r from-red-700 to-red-600 text-white p-4 shadow-lg">
            <div className="max-w-5xl mx-auto flex justify-between items-center flex-wrap gap-2">
              <div>
                <h1 className="text-xl font-bold">Movement Performance Assessment</h1>
                <p className="text-red-100 text-sm">Build Sports Performance Lab</p>
              </div>
              <div className="text-right text-sm">
                <p className="font-semibold">{athleteInfo.name}</p>
                <p className="text-red-200">Age {athleteInfo.age} • {athleteInfo.sport}</p>
              </div>
            </div>
          </div>

          {/* Summary Cards */}
          <div className="max-w-5xl mx-auto px-4 py-4">
            <div className="grid grid-cols-3 gap-3">
              <div className={`${leftRisk.bgLight} rounded-xl p-4 shadow border-l-4 ${leftRisk.border}`}>
                <p className="text-xs text-gray-600 font-medium">Left Leg</p>
                <p className="text-2xl font-bold">{leftTotal}<span className="text-sm text-gray-500">/34</span></p>
                <span className={`${leftRisk.color} text-white px-2 py-0.5 rounded text-xs font-bold`}>{leftRisk.label}</span>
              </div>
              <div className={`${rightRisk.bgLight} rounded-xl p-4 shadow border-l-4 ${rightRisk.border}`}>
                <p className="text-xs text-gray-600 font-medium">Right Leg</p>
                <p className="text-2xl font-bold">{rightTotal}<span className="text-sm text-gray-500">/34</span></p>
                <span className={`${rightRisk.color} text-white px-2 py-0.5 rounded text-xs font-bold`}>{rightRisk.label}</span>
              </div>
              <div className={`${asymmetry > 15 ? 'bg-orange-50 border-orange-500' : 'bg-white border-gray-200'} rounded-xl p-4 shadow border-l-4`}>
                <p className="text-xs text-gray-600 font-medium">Asymmetry</p>
                <p className="text-2xl font-bold">{asymmetry}%</p>
                {asymmetry > 15 && <span className="text-orange-600 text-xs">⚠️ Significant</span>}
              </div>
            </div>
          </div>

          {/* What-If Toggle */}
          <div className="max-w-5xl mx-auto px-4 mb-4">
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 flex justify-between items-center">
              <span className="text-blue-800 font-medium text-sm">📈 What-If Simulator</span>
              <button
                onClick={() => { if (!whatIfMode) setWhatIfScores(JSON.parse(JSON.stringify(scores))); setWhatIfMode(!whatIfMode); }}
                className={`px-4 py-1 rounded-full text-sm font-medium ${whatIfMode ? 'bg-blue-600 text-white' : 'bg-white text-blue-600 border border-blue-300'}`}
              >
                {whatIfMode ? '✨ Simulating' : 'Enable'}
              </button>
            </div>
          </div>

          {/* Tabs */}
          <div className="max-w-5xl mx-auto px-4">
            <div className="flex gap-1 border-b overflow-x-auto">
              {[{ id: 'scores', label: '📝 Scores' }, { id: 'results', label: '📊 Results' }, { id: 'risks', label: '⚠️ Risks' }, { id: 'training', label: '🎯 Training' }].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 font-medium text-sm border-b-2 whitespace-nowrap ${activeTab === tab.id ? 'border-red-600 text-red-600 bg-red-50' : 'border-transparent text-gray-500'}`}>
                  {tab.label}
                </button>
              ))}
            </div>
          </div>

          {/* Tab Content */}
          <div className="max-w-5xl mx-auto px-4 py-4">
            {/* SCORES TAB */}
            {activeTab === 'scores' && (
              <div className="space-y-4">
                {tests.map(test => (
                  <div key={test.id} className="bg-white rounded-xl shadow overflow-hidden">
                    <button onClick={() => toggleTest(test.id)} className="w-full p-4 flex justify-between items-center hover:bg-gray-50">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">🏃</div>
                        <div className="text-left">
                          <h4 className="font-bold">{test.name}</h4>
                          <p className="text-sm text-gray-500">{test.description}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-4">
                        <span className="text-sm">L: <strong>{calculateTestTotal(test.id, 'L')}</strong>/{test.maxPerLeg}</span>
                        <span className="text-sm">R: <strong>{calculateTestTotal(test.id, 'R')}</strong>/{test.maxPerLeg}</span>
                        <span>{expandedTests[test.id] ? '▲' : '▼'}</span>
                      </div>
                    </button>
                    {expandedTests[test.id] && (
                      <div className="p-4 bg-gray-50 border-t">
                        <table className="w-full text-sm bg-white rounded-lg">
                          <thead className="bg-gray-100">
                            <tr><th className="p-2 text-left">Domain</th><th className="p-2 text-center w-24">Left</th><th className="p-2 text-center w-24">Right</th></tr>
                          </thead>
                          <tbody>
                            {domains.map(domain => {
                              const applicable = domainApplicability[test.id][domain.id];
                              return (
                                <tr key={domain.id} className="border-t">
                                  <td className="p-2 font-medium">{domain.name}</td>
                                  <td className="p-2 text-center">
                                    {applicable ? (
                                      <select value={activeScores[test.id].L[domain.id] ?? 0} onChange={(e) => updateScore(test.id, 'L', domain.id, e.target.value)}
                                        className={`w-16 p-1 border rounded text-center font-bold ${whatIfMode ? 'border-blue-400 bg-blue-50' : ''} ${getScoreColor(activeScores[test.id].L[domain.id])}`}>
                                        <option value={0}>0</option><option value={1}>1</option><option value={2}>2</option>
                                      </select>
                                    ) : <span className="text-gray-300">N/A</span>}
                                  </td>
                                  <td className="p-2 text-center">
                                    {applicable ? (
                                      <select value={activeScores[test.id].R[domain.id] ?? 0} onChange={(e) => updateScore(test.id, 'R', domain.id, e.target.value)}
                                        className={`w-16 p-1 border rounded text-center font-bold ${whatIfMode ? 'border-blue-400 bg-blue-50' : ''} ${getScoreColor(activeScores[test.id].R[domain.id])}`}>
                                        <option value={0}>0</option><option value={1}>1</option><option value={2}>2</option>
                                      </select>
                                    ) : <span className="text-gray-300">N/A</span>}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                ))}
                <div className="bg-white rounded-xl p-4 shadow">
                  <div className="flex gap-3 text-sm">
                    <span className="px-3 py-1 rounded bg-green-100 text-green-800">2 = Adequate</span>
                    <span className="px-3 py-1 rounded bg-yellow-100 text-yellow-800">1 = Borderline</span>
                    <span className="px-3 py-1 rounded bg-red-100 text-red-800">0 = Needs Improvement</span>
                  </div>
                </div>
              </div>
            )}

            {/* RESULTS TAB */}
            {activeTab === 'results' && (
              <div className="space-y-4">
                <div className="bg-white rounded-xl shadow p-4">
                  <h3 className="font-bold mb-4">Domain Performance</h3>
                  {domains.map(domain => {
                    const avg = calculateDomainAverage(domain.id);
                    const interp = getDomainInterp(avg);
                    return (
                      <div key={domain.id} className="mb-4">
                        <div className="flex justify-between items-center mb-1">
                          <div className="flex items-center gap-2">
                            <span className="font-medium">{domain.name}</span>
                            <span className={`px-2 py-0.5 rounded text-xs ${interp.bg} ${interp.color}`}>{interp.label}</span>
                          </div>
                          <span className="font-bold">{avg.toFixed(1)}/2.0</span>
                        </div>
                        <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                          <div className={`h-full ${avg >= 1.6 ? 'bg-green-500' : avg >= 0.8 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{ width: `${(avg/2)*100}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
                {asymmetry > 15 && (
                  <div className="bg-orange-50 border border-orange-200 rounded-xl p-4">
                    <h4 className="font-bold text-orange-800">⚠️ Significant Asymmetry</h4>
                    <p className="text-orange-700 text-sm">{asymmetry}% difference. {leftTotal < rightTotal ? 'LEFT' : 'RIGHT'} leg needs priority.</p>
                  </div>
                )}
              </div>
            )}

            {/* RISKS TAB */}
            {activeTab === 'risks' && (
              <div className="space-y-3">
                {injuryRisks.map(injury => {
                  const color = injury.risk >= 75 ? 'bg-red-500' : injury.risk >= 50 ? 'bg-orange-500' : injury.risk >= 25 ? 'bg-yellow-500' : 'bg-green-500';
                  const label = injury.risk >= 75 ? 'High' : injury.risk >= 50 ? 'Elevated' : injury.risk >= 25 ? 'Moderate' : 'Low';
                  return (
                    <div key={injury.name} className="bg-white rounded-xl shadow p-4">
                      <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-xl">{injury.icon}</span>
                          <h3 className="font-bold">{injury.name}</h3>
                        </div>
                        <span className={`${color} text-white px-3 py-1 rounded-lg text-sm font-bold`}>{injury.risk}% {label}</span>
                      </div>
                      <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                        <div className={`h-full ${color}`} style={{ width: `${injury.risk}%` }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* TRAINING TAB */}
            {activeTab === 'training' && (
              <div className="space-y-4">
                <div className="bg-blue-50 rounded-lg p-3 flex justify-between items-center">
                  <span className="text-blue-800 text-sm"><strong>{selectedExercises.length}</strong> exercises selected</span>
                  {selectedExercises.length > 0 && <button onClick={() => setSelectedExercises([])} className="text-blue-600 text-sm">Clear</button>}
                </div>
                {domains.map(domain => {
                  const avg = calculateDomainAverage(domain.id);
                  const interp = getDomainInterp(avg);
                  const exercises = exerciseLibrary[domain.id] || [];
                  return (
                    <div key={domain.id} className="bg-white rounded-xl shadow overflow-hidden">
                      <button onClick={() => toggleDomain(domain.id)} className="w-full p-4 flex justify-between items-center hover:bg-gray-50">
                        <div className="flex items-center gap-3">
                          <div className={`w-3 h-3 rounded-full ${avg >= 1.6 ? 'bg-green-500' : avg >= 0.8 ? 'bg-yellow-500' : 'bg-red-500'}`} />
                          <span className="font-bold">{domain.name}</span>
                          <span className={`px-2 py-0.5 rounded text-xs ${interp.bg} ${interp.color}`}>{interp.label}</span>
                        </div>
                        <span className="text-sm text-gray-500">{exercises.length} exercises</span>
                      </button>
                      {expandedDomains[domain.id] && (
                        <div className="border-t divide-y">
                          {exercises.map(ex => {
                            const selected = selectedExercises.find(e => e.name === ex.name);
                            return (
                              <div key={ex.name} className={`p-4 cursor-pointer hover:bg-gray-50 ${selected ? 'bg-red-50' : ''}`} onClick={() => toggleExercise({ ...ex, domain: domain.name })}>
                                <div className="flex items-start gap-3">
                                  <div className={`w-5 h-5 rounded border-2 flex items-center justify-center ${selected ? 'bg-red-600 border-red-600 text-white' : 'border-gray-300'}`}>
                                    {selected && '✓'}
                                  </div>
                                  <div className="flex-1">
                                    <div className="flex justify-between">
                                      <span className="font-medium">{ex.name}</span>
                                      <span className="text-sm text-gray-500">{ex.sets}</span>
                                    </div>
                                    <p className="text-sm text-gray-600 mt-1">💡 {ex.why}</p>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Footer */}
          <div className="bg-gray-800 text-white py-6 mt-8">
            <div className="max-w-5xl mx-auto px-4 text-center">
              <p className="font-bold">Build Sports Performance Lab and Physical Therapy</p>
              <p className="text-gray-400 text-sm mt-1">Evidence-Based Movement Analysis • Injury Prevention • Performance Enhancement</p>
              <p className="text-gray-500 text-xs mt-2">Based on MPA by Christopher M. Powers, PhD, PT, FACSM, FAPTA</p>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MPAInteractiveTool />);
  </script>
</body>
</html>
